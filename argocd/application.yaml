apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sinhalovely2628-crypto/e-commerce-app-argocd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: ecom

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
EOF